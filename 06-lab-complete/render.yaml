# Render Blueprint — phương án thay cho railway.toml (tiêu chí 12)
# File nằm trong 06-lab-complete/, nên khi tạo Blueprint trên Render chọn đường dẫn này.
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        sync: false            # nhập tay trên dashboard, không ghi giá trị ở đây
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []            # chỉ cho service trong cùng tài khoản Render truy cập
