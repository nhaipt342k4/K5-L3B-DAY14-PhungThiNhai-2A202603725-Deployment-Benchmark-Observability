# Railway — deploy từ thư mục 06-lab-complete/ (tiêu chí 12)
# Biến môi trường đặt trên dashboard/CLI, KHÔNG ghi ở đây:
#   AGENT_API_KEY (secret), REDIS_URL (tham chiếu Redis của project), ENVIRONMENT=production
#   PORT do Railway tự cấp; Dockerfile CMD đọc ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
